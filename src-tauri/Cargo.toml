[package]
name = "replay-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "replay_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-capture = { version = "=2.0.1", path = "../vendor/windows-capture" }
windows = { version = "=0.62.2", features = ["Foundation", "Foundation_Metadata", "Graphics_Capture", "Media_Core", "Media_MediaProperties", "Media_Transcoding", "Security_Authorization_AppCapabilityAccess", "Security_Cryptography", "Storage_Streams", "Win32_Foundation", "Win32_Media_MediaFoundation", "Win32_System_Com", "Win32_System_WinRT"] }
